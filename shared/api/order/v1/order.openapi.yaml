openapi: "3.0.3"

info:
  title: "Order API"
  description: "HTTP API для управления заказами микросервиса Order"
  version: "v1"

servers:
  - url: http://localhost:8080

paths:
  /api/v1/orders:
    post:
      summary: "Создать заказ"
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: "Заказ успешно создан"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: "Некорректный запрос"
        "502":
          description: "Ошибка внешнего сервиса"

  /api/v1/orders/{order_uuid}:
    get:
      summary: "Получить заказ по UUID"
      operationId: getOrder
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Информация о заказе"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "Некорректный UUID заказа"
        "404":
          description: "Заказ не найден"

  /api/v1/orders/{order_uuid}/pay:
    post:
      summary: "Оплатить заказ"
      operationId: payOrder
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayOrderRequest"
      responses:
        "200":
          description: "Заказ успешно оплачен"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayOrderResponse"
        "400":
          description: "Некорректный запрос"
        "404":
          description: "Заказ не найден"
        "409":
          description: "Заказ уже оплачен или отменён"

  /api/v1/orders/{order_uuid}/cancel:
    post:
      summary: "Отменить заказ"
      operationId: cancelOrder
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Заказ успешно отменён"
        "400":
          description: "Некорректный UUID заказа"
        "404":
          description: "Заказ не найден"
        "409":
          description: "Заказ оплачен или уже отменён"

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - user_uuid
        - part_uuids
      properties:
        user_uuid:
          type: string
          description: "UUID пользователя"
        part_uuids:
          type: array
          items:
            type: string
          description: "Список UUID деталей"

    CreateOrderResponse:
      type: object
      properties:
        uuid:
          type: string
        total_price:
          type: number
          format: double

    PayOrderRequest:
      type: object
      required:
        - payment_method
      properties:
        payment_method:
          type: string
          enum:
            - PAYMENT_METHOD_CARD
            - PAYMENT_METHOD_SBP
            - PAYMENT_METHOD_CREDIT_CARD
            - PAYMENT_METHOD_INVESTOR_MONEY

    PayOrderResponse:
      type: object
      properties:
        transaction_uuid:
          type: string

    Order:
      type: object
      properties:
        order_uuid:
          type: string
        user_uuid:
          type: string
        part_uuids:
          type: array
          items:
            type: string
        total_price:
          type: number
          format: double
        transaction_uuid:
          type: string
          nullable: true
        payment_method:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - PENDING_PAYMENT
            - PAID
            - ASSEMBLED
            - CANCELLED
