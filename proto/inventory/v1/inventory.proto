syntax = "proto3";

package inventory.v1;

option go_package = "shared/pkg/proto/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

service InventoryService {

    // Возвращает информацию о детали по её UUID
    rpc GetPart(GetPartRequest) returns (GetResponse);

    // Возвращает список деталей с возможностью фильтрации
    rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Категория детали
enum Category { 
    CATEGORY_UNSPECIFIED = 0;
    CATEGORY_ENGINE = 1;
    CATEGORY_FUEL = 2;
    CATEGORY_PORTHOLE = 3;
    CATEGORY_WING = 4;
}

// Габариты и вес детали
message Dimensions {
    double length = 1;
    double width = 2;
    double height = 3;
    double weight = 4;
}

// Информация о производителе детали
message Manufacturer {
    string name = 1;
    string country = 2;
    string website = 3;
}

// Универсальное значение метаданных
message Value {
    string string_value = 1;
    int64 int64_value = 2;
    double double_value = 3;
    bool bool_value = 4;
}

// Информация о детали
message Part {
    string uuid = 1;
    string name = 2;
    string description = 3;
    double price = 4;
    int64 stock_quantity = 5;
    Category category = 6;
    Dimensions dimensions = 7;
    Manufacturer manufacturer = 8;
    repeated string tags = 9;
    map<string, Value> metadata = 10;
    google.protobuf.Timestamp created_at = 11;
    google.protobuf.Timestamp updated_at = 12;
}

// Фильтр по деталям (все поля опциональны)
message PartsFilter {
    repeated google.protobuf.StringValue uuids = 1;
    repeated google.protobuf.StringValue names = 2;
    repeated Category categories = 3;
    repeated google.protobuf.StringValue manufacturer_countries = 4;
    repeated google.protobuf.StringValue tags = 5;
}

// Запрос на получение детали по UUID
message GetPartRequest {
    string uuid = 1;
}

// Ответ с деталью
message GetResponse {
    Part part = 1;
}

// Запрос списка деталей с фильтром
message ListPartsRequest {
    PartsFilter filter = 1;
}

// Ответ со списком деталей
message ListPartsResponse {
    repeated Part parts = 1;
}